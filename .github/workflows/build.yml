name: Build Exilon Tracker Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Build x64 Exe
      run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish/x64

    - name: Build x86 Exe
      run: dotnet publish -c Release -r win-x86 --self-contained true /p:PublishSingleFile=true -o ./publish/x86

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./publish/x64/ExilonTracker.exe
          ./publish/x86/ExilonTracker.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
