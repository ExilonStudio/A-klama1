build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build APK
      run: |
        cd SourcesAndroid
        gradle assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: ExilonTracker-Android-APK
        path: SourcesAndroid/app/build/outputs/apk/debug/app-debug.apk
