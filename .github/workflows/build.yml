name: Build Exilon Tracker Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build x64 Exe
      run: dotnet publish ExilonTracker.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish/x64

    - name: Build x86 Exe
      run: dotnet publish ExilonTracker.csproj -c Release -r win-x86 --self-contained true /p:PublishSingleFile=true -o ./publish/x86

    - name: Upload Artifacts (x64 & x32)
      uses: actions/upload-artifact@v4
      with:
        name: ExilonTracker-Executables
        path: publish/
